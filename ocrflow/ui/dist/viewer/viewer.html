<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>PNG + TEI text viewer</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/ui/viewer/viewer.css">
</head>

<body>
<div class="app">
    <!-- LEFT: Index sidebar -->
    <aside class="sidebar" id="indexSidebar">
        <div class="sidebarHeader">
            <div class="sidebarTitle">Index</div>

            <button class="iconBtn" id="toggleIndexBtn" type="button" title="Minimize index" aria-label="Minimize index">
                ⟨
            </button>
        </div>

        <div class="sidebarControls">
            <div class="row">
                <input id="indexFilter" class="input" placeholder="Filter…" />
                <button id="reloadIndexBtn" class="btn" type="button">Reload</button>
            </div>
            <div class="hint" id="indexStatus"></div>
        </div>

        <div id="indexTree" class="indexTree"></div>
    </aside>

    <!-- RIGHT: Main area -->
    <main class="main">
        <!-- Top controls -->
        <div class="topbar">
            <div class="topbarGrid">
                <div class="field wide">
                    <label for="baseUrl">Base URL</label>
                    <input id="baseUrl" value="/api/v1" />
                </div>

                <div class="field">
                    <label for="datasetId">Dataset</label>
                    <select id="datasetId" class="input">
                        <option value="">Loading…</option>
                    </select>
                </div>

                <div class="field">
                    <label for="annotationId">Annotation</label>
                    <select id="annotationId" class="input">
                        <option value="">Select dataset…</option>
                    </select>
                </div>

                <div class="field">
                    <label>&nbsp;</label>
                    <label class="annoFilter">
                        <input id="onlyTranscribed" type="checkbox" checked />
                        <span>Only transcribed annotations</span>
                    </label>
                </div>

                <div class="field">
                    <label for="pageNum">Page</label>
                    <input id="pageNum" type="number" min="0" value="89" />
                </div>

                <div class="actions">
                    <button id="prevPage" class="btn" type="button">←</button>
                    <button id="loadBtn" class="btn primary" type="button">Load</button>
                    <button id="nextPage" class="btn" type="button">→</button>
                </div>
            </div>

            <div class="topbarMeta">
                <div class="hint mono" id="reqSummary"></div>
            </div>
        </div>

        <!-- Split view: Image left, TEI right -->
        <div class="split">
            <!-- Image pane -->
            <section class="pane">
                <div class="paneHeader">
                    <div>Image</div>
                    <div class="hint" id="imgStatus"></div>
                </div>

                <div class="paneBody imageBody">
                    <img id="pageImg" alt="Page image" />
                </div>
            </section>

            <!-- TEI pane -->
            <section class="pane">
                <div class="paneHeader">
                    <div>TEI</div>
                    <div class="hint" id="teiStatus"></div>
                </div>

                <div class="paneBody">
                    <div class="teiTools">

                        <button id="toggleAnnotationBtn" class="btn" type="button">
                            Annotation details
                        </button>

                        <button id="toggleTeiSourceBtn" class="btn" type="button">
                            TEI source code
                        </button>

                        <div class="teiSourceTools hidden" id="teiSourceTools">
                            <button id="renderBtn" class="btn" type="button">Render</button>
                        </div>

                        <div class="certCtl" title="Hide tokens below certainty threshold">
                            <label for="minCert" class="hint">Min certainty</label>
                            <input
                                    id="minCert"
                                    type="range"
                                    min="0.800"
                                    max="1.000"
                                    step="0.001"
                                    value="0.800"
                            />
                            <span id="minCertVal" class="hint mono">0.800</span>
                        </div>
                    </div>

                    <textarea id="teiInput" class="teiInput hidden" spellcheck="false" placeholder="TEI XML…"></textarea>

                    <div id="annotationDetails" class="renderBox hidden"></div>

                    <div id="out" class="renderBox">
                        <div class="empty">Click Load.</div>
                    </div>

                </div>
            </section>
        </div>
    </main>
</div>

<script type="module" src="/ui/viewer/viewer.js"></script>
</body>
</html>
