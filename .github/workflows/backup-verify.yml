name: backup-verify

on:
  schedule:
    - cron: '0 7 * * *' # every day at 7am UTC
  workflow_dispatch:

env:
  BACKUP_FILE_PREFIX: euclides_backup_
  DRIVE_REMOTE_NAME: Gdrive
  DRIVE_ROOT_FOLDER_ID: 1ajLNSEY8WN-Dcf3D_WxHZCm88mNeua4m
  LOOKBACK_HOURS: '7'

jobs:
  verify-backup:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
    steps:
      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Write rclone config
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Verify recent backup exists
        shell: bash
        run: |
          set -euo pipefail

          cutoff_epoch="$(date -u -d "${LOOKBACK_HOURS} hours ago" +%s)"
          mapfile -t backups < <(
            rclone lsjson "${DRIVE_REMOTE_NAME}:" \
              --drive-root-folder-id="${DRIVE_ROOT_FOLDER_ID}" \
              --files-only \
            | jq -r --arg prefix "${BACKUP_FILE_PREFIX}" '.[] | select(.Name | startswith($prefix)) | [.Name, .ModTime] | @tsv'
          )

          if [ "${#backups[@]}" -eq 0 ]; then
            echo "No backup ZIPs found in drive root folder ${DRIVE_ROOT_FOLDER_ID}."
            exit 1
          fi

          found_recent=false
          for entry in "${backups[@]}"; do
            name="${entry%%$'\t'*}"
            mod_time="${entry#*$'\t'}"
            mod_epoch="$(date -u -d "${mod_time}" +%s)"
            echo "${name} ${mod_time}"
            if [ "${mod_epoch}" -ge "${cutoff_epoch}" ]; then
              found_recent=true
            fi
          done

          if [ "${found_recent}" != true ]; then
            echo "No backup ZIP was updated in the last ${LOOKBACK_HOURS} hours."
            exit 1
          fi
