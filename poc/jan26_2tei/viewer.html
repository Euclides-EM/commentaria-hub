<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>PNG + TEI text viewer</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }

        .wrap {
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 12px;
            box-sizing: border-box;
        }

        .panel {
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .header {
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            font-weight: 650;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .content { flex: 1; min-height: 0; overflow: auto; padding: 10px; }

        img { max-width: 100%; height: auto; display: block; }

        textarea {
            width: 100%;
            height: 140px;
            box-sizing: border-box;
            resize: vertical;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 10px;
            outline: none;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            font-size: 12px;
            line-height: 1.35;
        }

        .toolbar {
            margin-top: 8px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-weight: 600;
        }

        button:active { transform: translateY(1px); }

        .hint { font-size: 12px; opacity: 0.75; }

        .renderBox {
            margin-top: 10px;
            border: 1px solid #eee;
            border-radius: 8px;
            background: #fcfcfc;
            padding: 14px;
            overflow: auto;
            line-height: 1.55;
            font-size: 15px;
            white-space: normal;
        }

        .renderBox p { margin: 0 0 10px 0; }
        .renderBox .pb {
            margin: 14px 0;
            padding-top: 10px;
            border-top: 1px dashed #ddd;
            color: #666;
            font-size: 12px;
            letter-spacing: 0.02em;
        }

        .renderBox .empty {
            color: #888;
            font-size: 13px;
        }

        .renderBox .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        }

        @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="wrap">
    <div class="panel">
        <div class="header">
            <div>Image</div>
            <div class="hint">Put page.png next to viewer.html</div>
        </div>
        <div class="content">
            <img src="data/export_doc30_paris_1615_jan_25_experiment_alto_202601030755/page-0502.png" alt="Page image" />
        </div>
    </div>

    <div class="panel">
        <div class="header">
            <div>TEI → Text</div>
            <div class="hint" id="status"></div>
        </div>
        <div class="content">
            <textarea id="teiInput" placeholder="Paste TEI XML here…"></textarea>

            <div class="toolbar">
                <button id="renderBtn">Render</button>
                <button id="clearBtn">Clear</button>

                <label class="hint">
                    <input type="checkbox" id="showPB" checked />
                    show page breaks
                </label>

                <label class="hint">
                    <input type="checkbox" id="keepEmptyP" />
                    keep empty paragraphs
                </label>
            </div>

            <div id="out" class="renderBox">
                <div class="empty">Paste TEI above then click Render.</div>
            </div>
        </div>
    </div>
</div>

<script>
    const teiInput = document.getElementById("teiInput");
    const out = document.getElementById("out");
    const status = document.getElementById("status");
    const showPB = document.getElementById("showPB");
    const keepEmptyP = document.getElementById("keepEmptyP");

    function escapeHtml(s) {
        return s
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;");
    }

    function isElement(node, localName) {
        return node && node.nodeType === Node.ELEMENT_NODE && node.localName === localName;
    }

    function parseXml(xmlString) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(xmlString, "application/xml");
        const pe = doc.getElementsByTagName("parsererror")[0];
        if (pe) throw new Error("XML parse error (often unescaped & or mismatched tags).");
        return doc;
    }

    // Convert a TEI node subtree into HTML text, respecting <lb/> and <pb/>
    function toReadingHtml(node, opts) {
        let html = "";

        for (const child of node.childNodes) {
            if (child.nodeType === Node.TEXT_NODE) {
                html += escapeHtml(child.nodeValue);
                continue;
            }

            if (child.nodeType !== Node.ELEMENT_NODE) continue;

            // TEI line break
            if (isElement(child, "lb")) {
                html += "<br>";
                continue;
            }

            // TEI page break
            if (isElement(child, "pb")) {
                if (opts.showPB) {
                    const facs = child.getAttribute("facs") || "";
                    const n = child.getAttribute("n") || "";
                    const label = (n || facs) ? `Page break ${escapeHtml(n || facs)}` : "Page break";
                    html += `<div class="pb">${label}</div>`;
                }
                continue;
            }

            // Paragraph-like and inline elements: recurse
            // (This keeps emphasis, hi, etc as plain text unless later extended)
            html += toReadingHtml(child, opts);
        }

        return html;
    }

    function renderTeiText() {
        const xml = teiInput.value.trim();
        if (!xml) {
            out.innerHTML = '<div class="empty">Paste TEI above then click Render.</div>';
            status.textContent = "";
            return;
        }

        try {
            const doc = parseXml(xml);

            // Find body first, otherwise fall back to text
            const body = doc.getElementsByTagNameNS("*", "body")[0]
                || doc.getElementsByTagNameNS("*", "text")[0]
                || doc.documentElement;

            const opts = { showPB: showPB.checked };

            // Collect <p> nodes (with any namespace) under body
            const ps = Array.from(body.getElementsByTagNameNS("*", "p"));

            let parts = [];

            if (ps.length) {
                for (const p of ps) {
                    const inner = toReadingHtml(p, opts).trim();

                    if (!inner && !keepEmptyP.checked) continue;

                    parts.push(`<p>${inner || "&nbsp;"}</p>`);
                }
            } else {
                // Fallback: render everything under body as one block
                const inner = toReadingHtml(body, opts).trim();
                parts.push(`<p>${inner || "&nbsp;"}</p>`);
            }

            out.innerHTML = parts.join("");
            status.textContent = `Rendered ${parts.length} text part(s).`;
        } catch (e) {
            out.innerHTML = `<div class="empty"><span class="mono">${escapeHtml(String(e.message || e))}</span></div>`;
            status.textContent = "Error";
        }
    }

    document.getElementById("renderBtn").addEventListener("click", renderTeiText);
    document.getElementById("clearBtn").addEventListener("click", () => {
        teiInput.value = "";
        status.textContent = "";
        out.innerHTML = '<div class="empty">Paste TEI above then click Render.</div>';
    });

    // re-render when toggles change (if something is already rendered)
    showPB.addEventListener("change", () => teiInput.value.trim() && renderTeiText());
    keepEmptyP.addEventListener("change", () => teiInput.value.trim() && renderTeiText());
</script>
</body>
</html>
